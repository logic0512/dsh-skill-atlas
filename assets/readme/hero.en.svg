<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">技能大全 dsh-skill-atlas</title>
  <desc id="heroDesc">Left: project name and one-line value. Right: five source directories converging into three skill cards.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#242830"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="18" fill="#0F1113"/>
  <rect width="1200" height="400" rx="18" fill="none" stroke="#23262B"/>
  <rect x="600" y="0" width="600" height="400" fill="url(#dots)" opacity=".5"/>

  <!-- 左：身份与承诺 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
    <text x="64" y="74" font-size="17" letter-spacing="2.4" fill="#7C838D">DEEPSEEK HARNESS · PLUGIN</text>

    <text x="64" y="150" font-size="54" font-weight="600" fill="#F2F0EC">技能大全</text>
    <text x="64" y="186" font-size="20" fill="#6E747E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">dsh-skill-atlas</text>

    <text x="64" y="242" font-size="22" fill="#C3C9D1">Every skill on your machine,</text>
    <text x="64" y="274" font-size="22" fill="#C3C9D1">in one DSH sidebar.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="64" y="350" font-size="38" font-weight="600" fill="#F2F0EC">13</text>
      <text x="64" y="374" font-size="15" fill="#7C838D" font-family="-apple-system, 'PingFang SC', sans-serif">roots</text>
      <line x1="164" y1="326" x2="164" y2="380" stroke="#262A30"/>

      <text x="188" y="350" font-size="38" font-weight="600" fill="#F2F0EC">456</text>
      <text x="188" y="374" font-size="15" fill="#7C838D" font-family="-apple-system, 'PingFang SC', sans-serif">skills</text>
      <line x1="286" y1="326" x2="286" y2="380" stroke="#262A30"/>

      <text x="310" y="350" font-size="38" font-weight="600" fill="#F2F0EC">16</text>
      <text x="310" y="374" font-size="15" fill="#7C838D" font-family="-apple-system, 'PingFang SC', sans-serif">categories</text>
    </g>
  </g>

  <!-- 右：五个来源汇聚成卡片 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#98A0AA">
    <g stroke="#39404A" fill="none">
      <rect x="632" y="82" width="14" height="12" rx="3"/>
      <rect x="632" y="126" width="14" height="12" rx="3"/>
      <rect x="632" y="170" width="14" height="12" rx="3"/>
      <rect x="632" y="214" width="14" height="12" rx="3"/>
      <rect x="632" y="258" width="14" height="12" rx="3"/>
    </g>
    <text x="658" y="93">~/.dsh/skills</text>
    <text x="658" y="137">~/.agents/skills</text>
    <text x="658" y="181">~/.codex/skills</text>
    <text x="658" y="225">~/.claude/skills</text>
    <text x="658" y="269">plugins</text>

    <g stroke="#2E353E" fill="none">
      <path d="M806 88 H846 V180"/>
      <path d="M806 132 H846 V180"/>
      <path d="M806 176 H846 V180"/>
      <path d="M806 220 H846 V180"/>
      <path d="M806 264 H846 V180"/>
      <path d="M814 180 H864" stroke="#4F7CFF"/>
    </g>
    <circle cx="866" cy="180" r="3.5" fill="#4F7CFF"/>
  </g>

  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <g>
      <rect x="862" y="70" width="290" height="58" rx="11" fill="#17191C" stroke="#2A2D33"/>
      <text x="872" y="105" font-size="18" font-weight="600" fill="#E8EAED">guizang-ppt-skill</text>
      <rect x="1070" y="89" width="72" height="22" rx="11" fill="#16281F" stroke="#25402F"/>
      <text x="1106" y="104" font-size="12.5" fill="#6FCE9A" text-anchor="middle">resolvable</text>
    </g>
    <g>
      <rect x="862" y="148" width="290" height="58" rx="11" fill="#17191C" stroke="#2A2D33"/>
      <text x="872" y="183" font-size="18" font-weight="600" fill="#E8EAED">seedance-camera</text>
      <rect x="1070" y="167" width="72" height="22" rx="11" fill="#2A2416" stroke="#453A1C"/>
      <text x="1106" y="182" font-size="12.5" fill="#E0B64A" text-anchor="middle">not linked</text>
    </g>
    <g>
      <rect x="862" y="226" width="290" height="58" rx="11" fill="#17191C" stroke="#2A2D33"/>
      <text x="872" y="261" font-size="18" font-weight="600" fill="#E8EAED">artifact-template-*</text>
      <rect x="1070" y="245" width="72" height="22" rx="11" fill="#18233D" stroke="#26355C"/>
      <text x="1106" y="260" font-size="12.5" fill="#8FB0FF" text-anchor="middle">collapsed</text>
    </g>
    <text x="862" y="322" font-size="15" fill="#5F666F">13 roots → 456 skills</text>
  </g>
</svg>
